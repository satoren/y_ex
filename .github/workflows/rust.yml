on:
  push:
    branches:
      - main
    paths:
      - 'native/**'
  pull_request:
    paths:
      - 'native/**'
  workflow_dispatch:


jobs:
  lint:
    name: Rust linter
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Run clippy
      run: cargo clippy -- -D warnings
      working-directory: native/yex
    - name: format check
      run: cargo fmt --check
      working-directory: native/yex
    - name: Test
      # Since rustler 0.39 the `enif_*` functions are linked directly on Linux and are
      # only provided by the BEAM at load time, so a test executable cannot resolve
      # them. Link it statically and leave them unresolved; the tests never call them.
      run: cargo test --workspace --target x86_64-unknown-linux-gnu
      working-directory: native/yex
      env:
        RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-Wl,--unresolved-symbols=ignore-all
