# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A newer push to the same pull request supersedes the running matrix. Any other run
# (a push to main) gets a group of its own, so every main commit is tested and keeps
# its coverage report.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }}, OTP ${{ matrix.pair.otp }}, Elixir ${{ matrix.pair.elixir }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every combination finish, so one failing OTP or OS does not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        pair:
          - { otp: "29", elixir: "1.20", latest: true }
          - { otp: "28", elixir: "1.20" }
          - { otp: "27", elixir: "1.20" }
          - { otp: "28", elixir: "1.19" }
          - { otp: "27", elixir: "1.19" }
          - { otp: "26", elixir: "1.19" }
          - { otp: "28", elixir: "1.18" }
          - { otp: "27", elixir: "1.18" }
          - { otp: "26", elixir: "1.18" }
          - { otp: "27", elixir: "1.17" }
          - { otp: "26", elixir: "1.17" }
          - { otp: "25", elixir: "1.17" }
          - { otp: "26", elixir: "1.16" }
          - { otp: "25", elixir: "1.16" }
        # builds.hex.pm has no OTP 25 for ubuntu-26.04 (ubuntu-latest), so run those
        # pairs on ubuntu-24.04 instead.
        exclude:
          - { os: ubuntu-latest, pair: { otp: "25", elixir: "1.17" } }
          - { os: ubuntu-latest, pair: { otp: "25", elixir: "1.16" } }
        include:
          - { os: ubuntu-24.04, pair: { otp: "25", elixir: "1.17" } }
          - { os: ubuntu-24.04, pair: { otp: "25", elixir: "1.16" } }

    env:
      MIX_ENV: test
      YEX_REQUIRE_YJS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.pair.otp }}
          elixir-version: ${{ matrix.pair.elixir }}
          version-type: ${{ matrix.pair.strict && 'strict' || 'loose' }}
      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.pair.otp }}-${{ matrix.pair.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.pair.otp }}-${{ matrix.pair.elixir }}-
      - name: Install dependencies
        run: mix deps.get
      # The tests always build the NIF (force_build in config/config.exs). Build it with
      # the Rust version in .tool-versions, which the release uses too.
      - name: Read the Rust version
        shell: bash
        run: echo "RUST_VERSION=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      # Caching the compiled dependencies saves most of the NIF build. Only main saves
      # the cache, so pull requests reuse it without evicting each other's entries.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/yex
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: test/support/yjs/package-lock.json
      - name: Install Yjs for the compatibility tests
        run: npm ci --prefix test/support/yjs
      - name: Run tests
        run: mix coveralls.github --parallel --flagname "${{ matrix.os }}-otp-${{ matrix.pair.otp }}-elixir-${{ matrix.pair.elixir }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test_finish:
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: '.tool-versions'
          version-type: 'strict'
      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-lint-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-lint-
      - name: Install dependencies
        run: mix deps.get
      # dialyzer and docs compile the project, which builds the NIF.
      - name: Read the Rust version
        run: echo "RUST_VERSION=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/yex
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: format check
        run: mix format --check-formatted
      - name: Run credo
        run: mix credo
      - name: Run dialyzer
        run: mix dialyzer
      - name: gen docs
        run: mix docs
