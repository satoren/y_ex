# documentation.

name: Elixir CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }}, OTP ${{ matrix.pair.otp }}, Elixir ${{ matrix.pair.elixir }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        pair:
          - { otp: "29", elixir: "1.20", latest: true }
          - { otp: "28", elixir: "1.20" }
          - { otp: "27", elixir: "1.20" }
          - { otp: "28", elixir: "1.19" }
          - { otp: "27", elixir: "1.19" }
          - { otp: "26", elixir: "1.19" }
          - { otp: "27", elixir: "1.17" }
          - { otp: "26", elixir: "1.17" }
          - { otp: "25", elixir: "1.17" }
          - { otp: "26", elixir: "1.16" }
          - { otp: "25", elixir: "1.16" }

    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.pair.otp }}
          elixir-version: ${{ matrix.pair.elixir }}
          version-type: ${{ matrix.pair.strict && 'strict' || 'loose' }}
      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.pair.otp }}-${{ matrix.pair.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.pair.otp }}-${{ matrix.pair.elixir }}-
      - name: Install dependencies
        run: mix deps.get
      - name: Run tests
        run: mix coveralls.github --parallel --flagname "${{ matrix.os }}-otp-${{ matrix.pair.otp }}-elixir-${{ matrix.pair.elixir }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test_finish:
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: '.tool-versions'
          version-type: 'strict'
      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-lint-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-lint-
      - name: Install dependencies
        run: mix deps.get
      - name: format check
        run: mix format --check-formatted
      - name: Run credo
        run: mix credo
      - name: Run dialyzer
        run: mix dialyzer
      - name: gen docs
        run: mix docs
